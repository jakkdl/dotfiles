[General]
# if not using systemd-networkd for dhcp
#EnableNetworkConfiguration=true
#RoutePriorityOffset=300

[Scan]
DisablePeriodicScan=true

[DriverQuirks]
# ath11k sometimes fails iwd's boot-time interface recreation with ENFILE
# ("NEW_INTERFACE failed: Too many open files in system"), leaving no
# station device; using the kernel's default interface avoids the recreate.
UseDefaultInterface=ath11k*

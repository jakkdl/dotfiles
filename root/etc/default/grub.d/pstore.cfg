# Save the kernel log to EFI variables on a panic or oops, read back at the
# next boot by systemd-pstore.service into /var/lib/systemd/pstore. Arch builds
# efi_pstore in but disables it by default. Regenerate with
# `grub-mkconfig -o /boot/grub/grub.cfg` after changing this.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT efi_pstore.pstore_disable=0"

# Suspend wake sources on the ThinkPad T14 Gen 5 (AMD).
#
# GPIO 0 of the AMD GPIO controller (AMDI0030:00) is the power-button line.
# With the lid closed it also fires when the lid is pressed or the laptop is
# shaken, waking it from suspend inside a bag, so it is not a wake source.
# Opening the lid also raises an embedded controller event, which still wakes
# it, as do USB input and plugging in power. The power button works while
# awake but may not wake it from suspend. Check with
# `journalctl -k -b | grep 'Ignoring wakeup'`.
#
# pm_debug_messages logs the wake reason on every resume, e.g.
# `journalctl -k | grep -E 'Triggering wakeup from IRQ|GPIO [0-9]+ is active'`.
#
# Regenerate with `grub-mkconfig -o /boot/grub/grub.cfg` after changing this.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT gpiolib_acpi.ignore_wake=AMDI0030:00@0 pm_debug_messages"

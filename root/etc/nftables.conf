#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# Arch's stock "simple & safe" ruleset, plus what this laptop needs. It roams onto
# untrusted wifi, and rootless podman publishes dev stacks (redis included) on
# 0.0.0.0, so inbound is dropped unless it's loopback, the tailnet, or a reply.
#
# Tailscale runs with --netfilter-mode=off: its own rules drop everything from
# 100.64.0.0/10 not arriving on tailscale0, and some captive portals live there
# (WIFIonICE). Tailnet traffic is let in by interface here instead, which wifi
# can't spoof the way it can a source address.
#
# There's deliberately no forward chain. Nothing forwards today (ip_forward=0), and
# rootful podman/docker networking enables forwarding and accepts in its own table,
# which a policy-drop forward chain here would silently override.

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    meta l4proto { icmp, icmpv6 } accept comment "allow icmp"
    iifname "tailscale0" accept comment "tailnet, already filtered by tailscaled per ACL"
    udp dport 41641 accept comment "tailscale direct (non-DERP) connections"
    # mDNS answers go to the multicast group rather than back to the asking
    # socket, so conntrack can't tie them to the query; needed for <host>.local
    udp dport 5353 accept comment "mdns replies"
    # same for DHCPv6: the solicit is multicast, the reply unicast from a router
    ip6 saddr fe80::/10 udp dport 546 accept comment "dhcpv6 replies"
    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
}

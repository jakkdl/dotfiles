# Magic SysRq keys allowed from the keyboard, a bitmask (see
# https://docs.kernel.org/admin-guide/sysrq.html):
#   8   debugging dumps: w blocked tasks, t all tasks, c crash into pstore
#   16  s sync
#   32  u remount everything read-only
#   128 b reboot, o power off
# Signals (64) and SAK (4) are left off: they can't reach a task stuck in
# uninterruptible sleep, which is what the dumps are for.
kernel.sysrq = 184

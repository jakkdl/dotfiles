[Resolve]

# Upstream resolver(s) used for ALL lookups. Quad9 (Swiss non-profit): no logging,
# blocks known malware/phishing domains. The #dns.quad9.net suffix is the TLS
# certificate/SNI name verified when DNSOverTLS is on (below); without it, cert
# validation can't be done. Both the IPv4 (9.9.9.9) and IPv6 (2620:fe::9) anycast
# addresses are listed — resolved picks the first that answers and sticks with it.
DNS=9.9.9.9#dns.quad9.net 2620:fe::9#dns.quad9.net

# Last-resort servers, used ONLY when every DNS= server above is unreachable and no
# other servers are configured anywhere. Pointed at Quad9's *secondary* anycast IPs
# so a primary outage stays within Quad9 (same no-log/filtering policy) instead of
# silently dropping to systemd's compiled-in defaults (Cloudflare/Google).
FallbackDNS=149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net

# Route EVERY domain to the servers above. "~." is the DNS root as a routing domain,
# i.e. a catch-all. This is the line that makes resolved the single source of truth:
# without it, resolved prefers each link's DHCP-provided servers (the ISP's Nuuday
# resolvers) for normal queries and only treats the global servers as a fallback.
Domains=~.

# Encrypt DNS to the servers above with TLS (port 853). "opportunistic" = use TLS
# when reachable, fall back to plaintext (port 53) if a network blocks it. Chosen
# over strict "yes" because this is a roaming laptop: strict mode would break
# resolution entirely on captive-portal wifi (hotels/airports) that block port 853.
# Trade-off: a network attacker can force the plaintext downgrade.
DNSOverTLS=opportunistic
